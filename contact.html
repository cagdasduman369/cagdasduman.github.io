<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Çağdaş Duman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="classbar" id="classbar"></div>
  <header class="site-head" id="site-head"></header>

  <main>
    <div id="content"><div class="skeleton">Loading…</div></div>
  </main>

  <footer class="site-foot" id="site-foot"></footer>

  <script src="assets/js/common.js"></script>
  <script>
    (async function () {
      await buildChrome('contact.html');
      const data = await loadJSON('content/contact.json');
      const content = document.getElementById('content');

      content.innerHTML = `
        <div class="page-eyebrow">${escapeHtml(data.eyebrow)}</div>
        <h1 class="page-title">${escapeHtml(data.title)}</h1>
        <p class="page-lede">${escapeHtml(data.lede)}</p>
        <div class="contact-row">
          <div class="contact-label">Email</div>
          <div class="contact-value"><a href="mailto:${data.email}">${escapeHtml(data.email)}</a></div>
        </div>
        <div class="contact-row">
          <div class="contact-label">Connect</div>
          <div class="chip-row">
            ${data.connect.map(c => `<a class="chip" href="${c.url}" target="_blank" rel="noopener">${escapeHtml(c.label)}</a>`).join('')}
          </div>
        </div>
      `;
    })();
  </script>
</body>
</html>
