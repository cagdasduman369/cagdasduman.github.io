<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Çağdaş Duman — Political Scientist | IR &amp; Middle East Studies</title>
<meta name="description" content="Dr. Çağdaş Duman — researcher, author and educator specializing in International Relations, Middle East Politics, Violent Non-State Actors and Political Shock Doctrine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="classbar" id="classbar"></div>
  <header class="site-head" id="site-head"></header>

  <main>
    <section class="hero" id="hero">
      <div class="skeleton">Loading…</div>
    </section>
  </main>

  <footer class="site-foot" id="site-foot"></footer>

  <script src="assets/js/common.js"></script>
  <script>
    (async function () {
      try {
        await buildChrome('index.html');
        const data = await loadJSON('content/home.json');
        const hero = document.getElementById('hero');

        hero.innerHTML = `
          <div class="hero-intro">
            <div class="hero-photo">
              <img src="photo.png" alt="Dr. Çağdaş Duman">
            </div>
            <div class="hero-content">
              <h1>Dr. Çağdaş Duman</h1>
              <p style="font-family: var(--serif); font-size: clamp(18px, 2.6vw, 24px); font-weight: 500; margin: 6px 0 0; line-height: 1.35; color: var(--slate);">
                Political Scientist | International Relations &amp; Middle East Studies
              </p>
            </div>
          </div>
          <p class="hero-sub">${escapeHtml(data.subtitle || '')}</p>
          <div class="hero-links">
            ${(data.links || []).map(link => `
              <a href="${escapeHtml(link.url || '#')}" target="_blank" rel="noopener noreferrer">
                ${escapeHtml(link.label || '')} ↗
              </a>
            `).join('')}
          </div>
        `;
      } catch (error) {
        console.error('Homepage loading error:', error);
        document.getElementById('hero').innerHTML = `
          <div class="hero-intro">
            <div class="hero-photo">
              <img src="photo.png" alt="Dr. Çağdaş Duman">
            </div>
            <div class="hero-content">
              <h1>Dr. Çağdaş Duman</h1>
              <p style="font-family: var(--serif); font-size: clamp(18px, 2.6vw, 24px); font-weight: 500; margin: 6px 0 0; line-height: 1.35; color: var(--slate);">
                Political Scientist | International Relations &amp; Middle East Studies
              </p>
            </div>
          </div>
          <p class="hero-sub">
            Researcher, author and educator specializing in International Relations,
            Middle East Politics, Violent Non-State Actors, and Political Shock Doctrine.
          </p>
        `;
      }
    })();
  </script>
</body>
</html>
