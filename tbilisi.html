  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background: #f5f5f5;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;

    h1 {

    }

    .location {
      color: #777;

    .intro {
      font-size: 17px;
      text-align: justify;

    .places {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      margin-bottom: 40px;
    }

    .place-card {
      background: #fff;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .place-card h2 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    .place-card p {
      color: #666;
      margin-bottom: 20px;
    }

    .place-card a {
      display: inline-block;
      background: #111;
      color: #fff;
      padding: 10px 22px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .place-card a:hover {
      background: #444;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #777;
      font-size: 14px;
      border-top: 1px solid #ddd;
    }

    @media (max-width: 700px) {
      .places {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>
